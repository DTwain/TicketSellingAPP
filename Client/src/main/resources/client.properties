# gRPC Basketball Ticket Shop Client Configuration

# gRPC Server Connection Settings - FIXED PORT
grpc.server.host=localhost
grpc.server.port=5000

# Connection Settings
grpc.connection.timeout=10000
grpc.retry.attempts=3
grpc.keepalive.time=30
grpc.keepalive.timeout=5

# Logging Configuration
logging.level=INFO
logging.file.path=logs/grpc-client.log

# UI Settings
ui.theme=default
ui.window.width=800
ui.window.height=600