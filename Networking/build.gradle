plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// gRPC and Protocol Buffers versions
ext {
    grpcVersion = '1.60.0'
    protobufVersion = '3.25.1'
    protocVersion = protobufVersion
}

dependencies {
    // Existing project dependencies
    implementation project(':Model')
    implementation project(':Services')

    // Existing dependencies
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.2'
    implementation 'org.apache.logging.log4j:log4j-api:2.17.2'

    // gRPC dependencies
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"

    // gRPC health check and status
    implementation "io.grpc:grpc-services:${grpcVersion}"
    implementation "io.grpc:grpc-context:${grpcVersion}"

    // Annotation processing for gRPC
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // Optional: gRPC testing dependencies
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"

    // Existing test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'
}

// Protocol Buffers configuration
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// Ensure generated sources are included in the source sets
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

// Java compilation settings
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

// Clean task to remove generated files
clean {
    delete 'build/generated'
}

test {
    useJUnitPlatform()
}

// Task to generate gRPC code
task generateProtoo {
    dependsOn 'generateProto'
    description = 'Generate Protocol Buffer and gRPC code'
    group = 'build'
}

// Make compile depend on proto generation
compileJava.dependsOn generateProto