syntax = "proto3";

package basketball_ticket;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option java_package = "com.basketball.ticket.grpc";
option java_outer_classname = "BasketballTicketProto";
option java_multiple_files = true;

// Domain Models
message User {
  int64 id = 1;
  string username = 2;
  string password = 3;
}

message Match {
  int64 id = 1;
  string team_a = 2;
  string team_b = 3;
  google.protobuf.Timestamp date_time = 4;
  int32 available_tickets = 5;
  string price_range = 6;
}

message Ticket {
  int64 id = 1;
  int64 match_id = 2;
  int32 seat_number = 3;
  bool sold = 4;
  double price = 5;
  int64 user_id = 6;
}

message TicketSale {
  int64 match_id = 1;
  string customer_name = 2;
  string customer_address = 3;
  int32 seats_purchased = 4;
}

enum UserType {
  UNKNOWN = 0;
  USER = 1;
  SELLER = 2;
}

// Request/Response Messages
message AuthenticateRequest {
  string username = 1;
  string password = 2;
}

message AuthenticateResponse {
  UserType user_type = 1;
  User user = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message GetUserRequest {
  oneof identifier {
    string username = 1;
    int64 user_id = 2;
  }
}

message GetUserResponse {
  User user = 1;
}

message GetMatchRequest {
  int64 match_id = 1;
}

message GetMatchResponse {
  Match match = 1;
}

message GetAllMatchesResponse {
  repeated Match matches = 1;
}

message GetAvailableTicketsRequest {
  int64 match_id = 1;
}

message GetAvailableTicketsResponse {
  int32 count = 1;
}

message GetPriceRangeRequest {
  int64 match_id = 1;
}

message GetPriceRangeResponse {
  string price_range = 1;
}

message SellTicketsRequest {
  TicketSale ticket_sale = 1;
}

message SellTicketsResponse {
  double total_price = 1;
}

message GetUserTicketsRequest {
  int64 user_id = 1;
}

message GetUserTicketsResponse {
  repeated Ticket tickets = 1;
}

message SearchCustomerTicketsRequest {
  string customer_name = 1;
}

message SearchCustomerTicketsResponse {
  repeated Ticket tickets = 1;
}

message CheckTicketSellerRequest {
  string username = 1;
}

message CheckTicketSellerResponse {
  bool is_ticket_seller = 1;
}

// Real-time update messages
message UpdateEvent {
  oneof event {
    MatchUpdatedEvent match_updated = 1;
    TicketSoldEvent ticket_sold = 2;
    UserTicketsChangedEvent user_tickets_changed = 3;
  }
}

message MatchUpdatedEvent {
  Match match = 1;
}

message TicketSoldEvent {
  Ticket ticket = 1;
}

message UserTicketsChangedEvent {
  User user = 1;
}

message SubscribeUpdatesRequest {
  int64 user_id = 1;
}

// Service Definitions
service UserService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc GetUserByUsername(GetUserRequest) returns (GetUserResponse);
  rpc GetUserById(GetUserRequest) returns (GetUserResponse);
  rpc CheckUsernameExists(GetUserRequest) returns (RegisterResponse);
}

service MatchService {
  rpc GetAllMatches(google.protobuf.Empty) returns (GetAllMatchesResponse);
  rpc GetMatch(GetMatchRequest) returns (GetMatchResponse);
}

service TicketService {
  rpc GetAvailableTickets(GetAvailableTicketsRequest) returns (GetAvailableTicketsResponse);
  rpc GetPriceRange(GetPriceRangeRequest) returns (GetPriceRangeResponse);
  rpc SellTickets(SellTicketsRequest) returns (SellTicketsResponse);
  rpc GetUserTickets(GetUserTicketsRequest) returns (GetUserTicketsResponse);
  rpc SearchCustomerTickets(SearchCustomerTicketsRequest) returns (SearchCustomerTicketsResponse);
}

service TicketSellerService {
  rpc CheckTicketSeller(CheckTicketSellerRequest) returns (CheckTicketSellerResponse);
}

service UpdateService {
  rpc SubscribeUpdates(SubscribeUpdatesRequest) returns (stream UpdateEvent);
}