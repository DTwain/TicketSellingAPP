
server.port=8080
logging.level.org.example=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.example.websocket=DEBUG
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# Enable HTTP methods
spring.mvc.dispatch-options-request=true

# WebSocket Configuration
spring.websocket.sockjs.enabled=false
spring.websocket.max-text-message-buffer-size=8192
spring.websocket.max-binary-message-buffer-size=8192

# Jackson configuration for LocalDateTime serialization
spring.jackson.deserialization.fail-on-unknown-properties=false