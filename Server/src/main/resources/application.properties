# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.org.example=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.example.websocket=DEBUG
logging.level.org.example.security=DEBUG
logging.level.org.springframework.security=INFO

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=NON_NULL

# HTTP Methods Configuration
spring.mvc.dispatch-options-request=true

# WebSocket Configuration
spring.websocket.sockjs.enabled=false
spring.websocket.max-text-message-buffer-size=8192
spring.websocket.max-binary-message-buffer-size=8192

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# Application Info
info.app.name=Basketball Ticket Shop
info.app.description=REST API with WebSocket support and JWT authentication
info.app.version=1.0.0