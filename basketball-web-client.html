<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Ticket Shop - Web Client</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .auth-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .user-details {
            color: white;
        }

        .user-role {
            background: #4CAF50;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .user-role.seller {
            background: #FF9800;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .auth-container {
            max-width: 400px;
            margin: 50px auto;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 1rem;
            font-weight: 600;
        }

        .auth-tab.active {
            background: rgba(255, 255, 255, 0.2);
        }

        .auth-tab:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
            color: white;
        }

        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(237, 137, 54, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 62, 62, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(113, 128, 150, 0.4);
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .match-card {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .match-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .match-teams {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
            text-align: center;
        }

        .match-date {
            color: #718096;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 15px;
        }

        .match-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .match-price {
            color: #2d5016;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #c6f6d5 0%, #9ae6b4 100%);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #68d391;
        }

        .match-availability {
            color: #744210;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fef5e7 0%, #fed7aa 100%);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #f6ad55;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
            font-size: 1.1rem;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #e53e3e;
        }

        .success {
            background: #c6f6d5;
            color: #2f855a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #48bb78;
        }

        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .websocket-status {
            background: #4299e1;
        }

        .websocket-connected {
            background: #48bb78;
        }

        .websocket-disconnected {
            background: #e53e3e;
        }

        .seller-only {
            border: 2px dashed #FF9800;
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
        }

        .client-info {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: 2px dashed #2196F3;
        }

        .role-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #FF9800;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .role-badge.client {
            background: #2196F3;
        }

        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
            }

            .matches-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .auth-header {
                flex-direction: column;
                gap: 15px;
            }

            .user-info {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Authentication utilities
    const AuthUtils = {
        getToken: () => localStorage.getItem('basketball_token'),
        setToken: (token) => localStorage.setItem('basketball_token', token),
        removeToken: () => localStorage.removeItem('basketball_token'),
        getUser: () => {
            const userStr = localStorage.getItem('basketball_user');
            return userStr ? JSON.parse(userStr) : null;
        },
        setUser: (user) => localStorage.setItem('basketball_user', JSON.stringify(user)),
        removeUser: () => localStorage.removeItem('basketball_user'),
        isAuthenticated: () => !!AuthUtils.getToken(),
        getAuthHeaders: () => ({
            'Authorization': `Bearer ${AuthUtils.getToken()}`,
            'Content-Type': 'application/json'
        })
    };

    // Main App Component
    function App() {
        const [isAuthenticated, setIsAuthenticated] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);
        const [matches, setMatches] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [success, setSuccess] = useState(null);
        const [editingMatch, setEditingMatch] = useState(null);
        const [websocketStatus, setWebsocketStatus] = useState('disconnected');
        const [statusMessage, setStatusMessage] = useState('');
        const websocket = useRef(null);

        const API_BASE = 'http://localhost:8080/api';
        const WS_URL = 'ws://localhost:8080/ws/matches';

        // Check authentication on app load
        useEffect(() => {
            checkAuthentication();
        }, []);

        const checkAuthentication = async () => {
            // Check for force logout parameter
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('logout') === 'true') {
                AuthUtils.removeToken();
                AuthUtils.removeUser();
                setLoading(false);
                return;
            }

            const token = AuthUtils.getToken();
            if (!token) {
                setLoading(false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (data.success && data.valid) {
                    setIsAuthenticated(true);
                    setCurrentUser(data.user);
                    AuthUtils.setUser(data.user);
                    loadMatches();
                    initWebSocket();
                } else {
                    // Token is invalid
                    handleLogout();
                }
            } catch (err) {
                console.error('Token validation error:', err);
                handleLogout();
            }

            setLoading(false);
        };

        const handleLogin = (userData) => {
            console.log('🔑 LOGIN: Starting handleLogin process');
            console.log('🔑 LOGIN: User data received:', userData);

            setIsAuthenticated(true);
            setCurrentUser(userData.user);
            AuthUtils.setToken(userData.token);
            AuthUtils.setUser(userData.user);
            setSuccess('Login successful! Welcome to Basketball Ticket Shop!');

            console.log('🔑 LOGIN: About to load matches');
            loadMatches();

            console.log('🔑 LOGIN: About to init WebSocket');
            console.log('🔑 LOGIN: isAuthenticated before initWebSocket:', isAuthenticated);
            initWebSocket();

            console.log('🔑 LOGIN: handleLogin completed');
        };

        const handleLogout = () => {
            setIsAuthenticated(false);
            setCurrentUser(null);
            setMatches([]);
            AuthUtils.removeToken();
            AuthUtils.removeUser();
            if (websocket.current) {
                websocket.current.close();
            }
            setWebsocketStatus('disconnected');
            setSuccess('Logged out successfully!');
        };

        // Load matches from REST API
        const loadMatches = async () => {
            if (!isAuthenticated) return;

            try {
                setLoading(true);
                setError(null);
                const response = await fetch(`${API_BASE}/matches`, {
                    headers: AuthUtils.getAuthHeaders()
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        handleLogout();
                        return;
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                setMatches(data);
                if (data.length > 0) {
                    setSuccess(`Loaded ${data.length} basketball matches!`);
                }
            } catch (err) {
                setError(`Failed to load matches: ${err.message}`);
                console.error('Error loading matches:', err);
            } finally {
                setLoading(false);
            }
        };

        // Initialize WebSocket connection
        // Initialize WebSocket connection
        const initWebSocket = () => {
            console.log('🚀 WEBSOCKET: initWebSocket called');
            console.log('🚀 WEBSOCKET: isAuthenticated =', isAuthenticated);
            console.log('🚀 WEBSOCKET: currentUser =', currentUser);
            console.log('🚀 WEBSOCKET: WS_URL =', WS_URL);

            if (!isAuthenticated) {
                console.log('❌ WEBSOCKET: Skipping - not authenticated');
                return;
            }

            try {
                console.log('🔗 WEBSOCKET: Setting status to connecting');
                setWebsocketStatus('connecting');
                setStatusMessage('Connecting to real-time updates...');

                console.log('🔗 WEBSOCKET: Creating WebSocket object');
                websocket.current = new WebSocket(WS_URL);
                console.log('🔗 WEBSOCKET: WebSocket object created:', websocket.current);

                websocket.current.onopen = () => {
                    console.log('✅ WEBSOCKET: onopen event fired');
                    setWebsocketStatus('connected');
                    setStatusMessage('Real-time updates enabled! 🚀');
                };

                websocket.current.onmessage = (event) => {
                    try {
                        console.log('📨 WEBSOCKET: Message received:', event.data);
                        const data = JSON.parse(event.data);

                        if (data.type === 'MATCH_UPDATED') {
                            console.log('🔄 WEBSOCKET: Match updated, refreshing');
                            loadMatches();
                            const action = data.operation.toLowerCase();
                            setStatusMessage(`Match ${action} - Data refreshed automatically!`);
                        } else if (data.type === 'CONNECTION_ESTABLISHED') {
                            console.log('🔗 WEBSOCKET: Connection confirmed');
                        }
                    } catch (err) {
                        console.error('❌ WEBSOCKET: Error parsing message:', err);
                    }
                };

                websocket.current.onerror = (error) => {
                    console.error('❌ WEBSOCKET: Error event:', error);
                    setWebsocketStatus('error');
                    setStatusMessage('Real-time updates connection failed');
                };

                websocket.current.onclose = (event) => {
                    console.log('🔌 WEBSOCKET: Close event. Code:', event.code, 'Reason:', event.reason);
                    setWebsocketStatus('disconnected');

                    if (event.code !== 1000) {
                        setStatusMessage('Connection lost. Retrying...');
                        setTimeout(() => {
                            if (isAuthenticated && (!websocket.current || websocket.current.readyState === WebSocket.CLOSED)) {
                                console.log('🔄 WEBSOCKET: Attempting reconnection...');
                                initWebSocket();
                            }
                        }, 3000);
                    }
                };

                console.log('🔗 WEBSOCKET: Event handlers attached');
            } catch (err) {
                console.error('❌ WEBSOCKET: Initialization error:', err);
                setWebsocketStatus('error');
                setStatusMessage(`Connection failed: ${err.message}`);
            }
        };

        // Clear messages after timeout
        useEffect(() => {
            if (success) {
                const timer = setTimeout(() => setSuccess(null), 4000);
                return () => clearTimeout(timer);
            }
        }, [success]);

        useEffect(() => {
            if (statusMessage) {
                const timer = setTimeout(() => setStatusMessage(''), 3000);
                return () => clearTimeout(timer);
            }
        }, [statusMessage]);

        if (loading) {
            return (
                <div className="container">
                    <div className="auth-container">
                        <div className="card">
                            <div className="loading">
                                🔄 Checking authentication...
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        if (!isAuthenticated) {
            return (
                <div className="container">
                    <div className="header">
                        <h1>🏀 Basketball Ticket Shop</h1>
                        <p>Your gateway to the best basketball matches - Please sign in to continue</p>
                    </div>
                    <AuthForm onLogin={handleLogin} onError={setError} onSuccess={setSuccess} />
                    {error && <div className="error">{error}</div>}
                    {success && <div className="success">{success}</div>}
                </div>
            );
        }

        return (
            <div className="container">
                <div className="header">
                    <div className="auth-header">
                        <div>
                            <h1>🏀 Basketball Ticket Shop</h1>
                            <p>
                                {currentUser?.isSeller
                                    ? 'Seller Dashboard - Create and manage basketball matches'
                                    : 'Client Portal - Browse exciting basketball matches'
                                }
                            </p>
                        </div>
                        <div className="user-info">
                            <div className="user-avatar">
                                {currentUser?.username?.charAt(0).toUpperCase()}
                            </div>
                            <div className="user-details">
                                <div style={{fontWeight: 'bold', fontSize: '1.1rem'}}>{currentUser?.username}</div>
                                <div className={`user-role ${currentUser?.isSeller ? 'seller' : 'client'}`}>
                                    {currentUser?.isSeller ? '🎫 Seller' : '👤 Client'}
                                </div>
                            </div>
                            <button className="btn btn-secondary" onClick={handleLogout}>
                                🚪 Logout
                            </button>
                        </div>
                    </div>
                </div>

                {statusMessage && (
                    <div className={`status websocket-${websocketStatus}`}>
                        {statusMessage}
                    </div>
                )}

                {error && <div className="error">{error}</div>}
                {success && <div className="success">{success}</div>}

                {/* Add debugging info */}
                <div style={{position: 'fixed', bottom: '10px', left: '10px', background: 'rgba(0,0,0,0.8)', color: 'white', padding: '10px', borderRadius: '5px', fontSize: '12px', zIndex: 1000}}>
                    <div>WebSocket Status: {websocketStatus}</div>
                    <div>WebSocket URL: {WS_URL}</div>
                    <div>Authenticated: {isAuthenticated ? 'Yes' : 'No'}</div>
                    <div>Ready State: {websocket.current?.readyState || 'None'}</div>
                </div>

                {currentUser?.isSeller ? (
                    <SellerDashboard
                        matches={matches}
                        loading={loading}
                        editingMatch={editingMatch}
                        setEditingMatch={setEditingMatch}
                        websocketStatus={websocketStatus}
                        websocket={websocket}
                        initWebSocket={initWebSocket}
                        onSuccess={(message) => {
                            loadMatches();
                            setSuccess(message);
                            setEditingMatch(null);
                        }}
                        onError={setError}
                        onRefresh={loadMatches}
                    />
                ) : (
                    <ClientDashboard
                        matches={matches}
                        loading={loading}
                        onRefresh={loadMatches}
                    />
                )}
            </div>
        );
    }

    // Authentication Form Component
    function AuthForm({ onLogin, onError, onSuccess }) {
        const [activeTab, setActiveTab] = useState('login');
        const [formData, setFormData] = useState({
            username: '',
            password: ''
        });
        const [loading, setLoading] = useState(false);

        const API_BASE = 'http://localhost:8080/api';

        const handleSubmit = async (e) => {
            e.preventDefault();

            if (!formData.username.trim() || !formData.password.trim()) {
                onError('Please fill in all fields');
                return;
            }

            setLoading(true);
            try {
                const endpoint = activeTab === 'login' ? '/auth/login' : '/auth/signup';
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    onLogin(data);
                    setFormData({ username: '', password: '' });
                } else {
                    onError(data.error || `${activeTab} failed`);
                }
            } catch (err) {
                onError(`${activeTab} error: ${err.message}`);
            } finally {
                setLoading(false);
            }
        };

        return (
            <div className="auth-container">
                <div className="card">
                    <div className="auth-tabs">
                        <button
                            className={`auth-tab ${activeTab === 'login' ? 'active' : ''}`}
                            onClick={() => setActiveTab('login')}
                        >
                            🔑 Login
                        </button>
                        <button
                            className={`auth-tab ${activeTab === 'signup' ? 'active' : ''}`}
                            onClick={() => setActiveTab('signup')}
                        >
                            ✨ Sign Up
                        </button>
                    </div>

                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label htmlFor="username">Username:</label>
                            <input
                                type="text"
                                id="username"
                                value={formData.username}
                                onChange={(e) => setFormData({...formData, username: e.target.value})}
                                placeholder="Enter your username"
                                required
                            />
                        </div>
                        <div className="form-group">
                            <label htmlFor="password">Password:</label>
                            <input
                                type="password"
                                id="password"
                                value={formData.password}
                                onChange={(e) => setFormData({...formData, password: e.target.value})}
                                placeholder="Enter your password"
                                required
                            />
                        </div>
                        <button
                            type="submit"
                            className="btn btn-primary"
                            disabled={loading}
                            style={{width: '100%'}}
                        >
                            {loading ? '⏳ Processing...' : (activeTab === 'login' ? '🚀 Login' : '🎉 Sign Up')}
                        </button>
                    </form>

                    {activeTab === 'signup' && (
                        <div style={{marginTop: '15px', padding: '15px', backgroundColor: '#f8f9fa', borderRadius: '8px', fontSize: '0.9rem'}}>
                            <strong>📋 Note:</strong> New accounts are created as <strong>Clients</strong> by default.
                            To become a <strong>Seller</strong>, contact an administrator.
                        </div>
                    )}
                </div>
            </div>
        );
    }

    // Seller Dashboard Component
    function SellerDashboard({ matches, loading, editingMatch, setEditingMatch, websocketStatus, websocket, initWebSocket, onSuccess, onError, onRefresh }) {        return (
            <>
                <div className="card seller-only">
                    <div className="role-badge">Seller</div>
                    <h2>🎟️ Match Management Center</h2>
                    <p>As a <strong>seller</strong>, you have full control to create, edit, and delete basketball matches.
                        Your changes will be broadcast in real-time to all connected clients!</p>

                    <div style={{marginTop: '15px', display: 'flex', gap: '10px', alignItems: 'center'}}>
                        <button
                            className="btn btn-secondary"
                            onClick={() => {
                                if (websocket.current && websocket.current.readyState === WebSocket.OPEN) {
                                    console.log('WebSocket is connected and ready');
                                    onSuccess('WebSocket connection verified! ✅');
                                } else {
                                    console.log('WebSocket not connected, attempting reconnection...');
                                    initWebSocket();
                                    onError('WebSocket reconnection attempted. Check status in a few seconds.');
                                }
                            }}
                        >
                            🔗 Test Connection
                        </button>
                        <span style={{fontSize: '0.9rem', color: '#666'}}>
            Status: <strong style={{color: websocketStatus === 'connected' ? '#4CAF50' : '#f44336'}}>
                {websocketStatus.toUpperCase()}
            </strong>
        </span>
                    </div>
                </div>

                <MatchForm
                    editingMatch={editingMatch}
                    setEditingMatch={setEditingMatch}
                    onSuccess={onSuccess}
                    onError={onError}
                />

                <MatchList
                    matches={matches}
                    loading={loading}
                    onEdit={setEditingMatch}
                    onDelete={(id) => deleteMatch(id)}
                    onRefresh={onRefresh}
                    userRole="seller"
                />
            </>
        );

        async function deleteMatch(id) {
            if (!confirm('🗑️ Are you sure you want to delete this match?\n\nThis action cannot be undone and will notify all connected clients.')) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/api/matches/${id}`, {
                    method: 'DELETE',
                    headers: AuthUtils.getAuthHeaders()
                });

                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('Access denied: Seller privileges required');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                onSuccess('🗑️ Match deleted successfully! All clients notified.');
            } catch (err) {
                onError(`Failed to delete match: ${err.message}`);
            }
        }
    }

    // Client Dashboard Component
    function ClientDashboard({ matches, loading, onRefresh }) {
        return (
            <>
                <div className="card client-info">
                    <div className="role-badge client">Client</div>
                    <h2>🏀 Available Basketball Matches</h2>
                    <p>Welcome to your <strong>client portal</strong>! Browse exciting basketball matches
                        and enjoy real-time updates when new matches are added or schedules change.</p>
                </div>

                <MatchList
                    matches={matches}
                    loading={loading}
                    onRefresh={onRefresh}
                    userRole="client"
                />
            </>
        );
    }

    // Match Form Component (Seller only)
    function MatchForm({ editingMatch, setEditingMatch, onSuccess, onError }) {
        const [formData, setFormData] = useState({
            teamA: '',
            teamB: '',
            dateTime: ''
        });
        const [loading, setLoading] = useState(false);

        const API_BASE = 'http://localhost:8080/api/matches';

        useEffect(() => {
            if (editingMatch) {
                setFormData({
                    teamA: editingMatch.teamA || '',
                    teamB: editingMatch.teamB || '',
                    dateTime: editingMatch.dateTime ? editingMatch.dateTime.slice(0, 16) : ''
                });
            }
        }, [editingMatch]);

        const handleSubmit = async (e) => {
            e.preventDefault();

            if (!formData.teamA.trim() || !formData.teamB.trim() || !formData.dateTime) {
                onError('Please fill in all fields');
                return;
            }

            if (formData.teamA.trim().toLowerCase() === formData.teamB.trim().toLowerCase()) {
                onError('Teams must be different!');
                return;
            }

            setLoading(true);
            try {
                const payload = {
                    teamA: formData.teamA.trim(),
                    teamB: formData.teamB.trim(),
                    dateTime: formData.dateTime
                };

                let response;
                if (editingMatch) {
                    response = await fetch(`${API_BASE}/${editingMatch.id}`, {
                        method: 'PUT',
                        headers: AuthUtils.getAuthHeaders(),
                        body: JSON.stringify(payload),
                    });
                } else {
                    response = await fetch(API_BASE, {
                        method: 'POST',
                        headers: AuthUtils.getAuthHeaders(),
                        body: JSON.stringify(payload),
                    });
                }

                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('Access denied: Seller privileges required');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                setFormData({ teamA: '', teamB: '', dateTime: '' });
                onSuccess(editingMatch
                    ? '✅ Match updated successfully! All clients notified.'
                    : '🎉 Match created successfully! All clients notified.'
                );
            } catch (err) {
                onError(`Failed to ${editingMatch ? 'update' : 'create'} match: ${err.message}`);
            } finally {
                setLoading(false);
            }
        };

        const handleCancel = () => {
            setEditingMatch(null);
            setFormData({ teamA: '', teamB: '', dateTime: '' });
        };

        return (
            <div className="card">
                <h2>{editingMatch ? '✏️ Edit Match' : '➕ Add New Match'}</h2>
                <form onSubmit={handleSubmit}>
                    <div className="form-group">
                        <label htmlFor="teamA">🏀 Team A:</label>
                        <input
                            type="text"
                            id="teamA"
                            value={formData.teamA}
                            onChange={(e) => setFormData({...formData, teamA: e.target.value})}
                            placeholder="e.g., Los Angeles Lakers"
                            required
                        />
                    </div>
                    <div className="form-group">
                        <label htmlFor="teamB">🏀 Team B:</label>
                        <input
                            type="text"
                            id="teamB"
                            value={formData.teamB}
                            onChange={(e) => setFormData({...formData, teamB: e.target.value})}
                            placeholder="e.g., Golden State Warriors"
                            required
                        />
                    </div>
                    <div className="form-group">
                        <label htmlFor="dateTime">📅 Match Date & Time:</label>
                        <input
                            type="datetime-local"
                            id="dateTime"
                            value={formData.dateTime}
                            onChange={(e) => setFormData({...formData, dateTime: e.target.value})}
                            required
                        />
                    </div>
                    <div className="button-group">
                        <button type="submit" className="btn btn-primary" disabled={loading}>
                            {loading ? '⏳ Processing...' : (editingMatch ? '💾 Update Match' : '🚀 Create Match')}
                        </button>
                        {editingMatch && (
                            <button type="button" className="btn btn-warning" onClick={handleCancel}>
                                ❌ Cancel Edit
                            </button>
                        )}
                    </div>
                </form>
            </div>
        );
    }

    // Match List Component
    function MatchList({ matches, loading, onEdit, onDelete, onRefresh, userRole }) {
        if (loading) {
            return (
                <div className="card">
                    <div className="loading">
                        🔄 Loading basketball matches...
                    </div>
                </div>
            );
        }

        return (
            <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                    <h2>
                        {userRole === 'seller' ? '🎯 Match Management' : '🏀 Available Matches'} ({matches.length})
                    </h2>
                    <button className="btn btn-success" onClick={onRefresh}>
                        🔄 Refresh
                    </button>
                </div>

                {matches.length === 0 ? (
                    <div style={{ textAlign: 'center', color: '#718096', fontSize: '1.1rem', padding: '40px' }}>
                        {userRole === 'seller'
                            ? '🏀 No matches found. Create your first exciting basketball match above!'
                            : '🏀 No matches available at the moment. Check back soon for exciting games!'
                        }
                    </div>
                ) : (
                    <div className="matches-grid">
                        {matches.map(match => (
                            <MatchCard
                                key={match.id}
                                match={match}
                                onEdit={onEdit}
                                onDelete={onDelete}
                                userRole={userRole}
                            />
                        ))}
                    </div>
                )}
            </div>
        );
    }

    // Individual Match Card Component
    // Individual Match Card Component
    function MatchCard({ match, onEdit, onDelete, userRole }) {
        const formatDate = (dateString) => {
            try {
                const date = new Date(dateString);
                return date.toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    weekday: 'short'
                });
            } catch {
                return 'Date not available';
            }
        };

        return (
            <div className="match-card">
                <div className="match-teams">
                    🏀 {match.teamA} vs {match.teamB}
                </div>
                <div className="match-date">
                    📅 {formatDate(match.dateTime)}
                </div>
                <div className="match-price">
                    💰 {match.priceRange || 'Price not available'}
                </div>
                <div className="match-availability">
                    🎫 {match.availableTickets !== undefined ? `${match.availableTickets} seats available` : 'Availability unknown'}
                </div>

                {userRole === 'seller' ? (
                    <div className="match-actions">
                        <button
                            className="btn btn-warning"
                            onClick={() => onEdit(match)}
                            title="Edit this match"
                        >
                            ✏️ Edit
                        </button>
                        <button
                            className="btn btn-danger"
                            onClick={() => onDelete(match.id)}
                            title="Delete this match"
                        >
                            🗑️ Delete
                        </button>
                    </div>
                ) : (
                    <div className="match-actions">
                        <button
                            className="btn btn-primary"
                            title="View match details"
                            onClick={() => alert(`🏀 Match Details:\n\n${match.teamA} vs ${match.teamB}\n📅 ${formatDate(match.dateTime)}\n💰 Price: ${match.priceRange || 'Not available'}\n🎫 Available seats: ${match.availableTickets || 'Unknown'}\n\n🎫 Contact a seller to purchase tickets!`)}
                        >
                            👁️ View Details
                        </button>
                    </div>
                )}
            </div>
        );
    }

    // Render the app
    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
